services:
  - type: web
    name: glorious-coaching-results
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python static/create_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false

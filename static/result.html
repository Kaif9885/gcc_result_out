<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Result | Glorious Coaching Centre</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="result-page">
  <main class="result-sheet">
    <header class="result-heading">
      <div class="result-brand">
        <img class="result-logo" src="/static/logo.jpeg" alt="Glorious Coaching Centre logo" />
        <span class="result-estd">Estd. 2011</span>
      </div>
      <div>
        <h1>GLORIOUS COACHING CENTRE</h1>
        <p>ARANDA, HASANPURA</p>
        <p id="resultClass" class="result-class"></p>
        <p class="result-subtitle">STUDENT RESULT OUT</p>
        <p id="resultDetails" class="result-details"></p>
      </div>
      <span class="result-heading-spacer" aria-hidden="true"></span>
    </header>

    <hr class="result-divider" />

    <table class="result-table">
      <thead>
        <tr>
          <th scope="col">Roll No.</th>
          <th scope="col">Name</th>
          <th scope="col">Total Marks</th>
          <th scope="col">Obtained Marks</th>
        </tr>
      </thead>
      <tbody id="resultRow"></tbody>
    </table>

    <p id="resultError" class="result-error" role="alert" hidden></p>

    <section class="top-results" aria-labelledby="topResultsTitle">
      <h2 id="topResultsTitle">TOP - 3 RESULTS</h2>
      <table class="result-table top-results-table">
        <thead>
          <tr>
            <th scope="col">Position</th>
            <th scope="col">Name</th>
            <th scope="col">Total Marks</th>
            <th scope="col">Obtained Marks</th>
          </tr>
        </thead>
        <tbody id="topResultsRows"></tbody>
      </table>
      <p id="topResultsError" class="result-error" role="alert" hidden></p>
    </section>
  </main>
  <script src="/static/result.js"></script>
</body>
</html>

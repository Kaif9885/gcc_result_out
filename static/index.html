<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Result</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card home-card">
    <header class="home-branding">
      <div class="home-brand">
        <img class="home-logo" src="/static/logo.jpeg" alt="Glorious Coaching Centre logo" />
        <span class="home-estd">Estd. 2011</span>
      </div>
      <div class="home-brand-text">
        <h1>GLORIOUS COACHING CENTRE</h1>
        <p>ARANDA, HASANPURA</p>
      </div>
    </header>

    <hr class="home-divider" />

    <h2 class="home-form-title">Check Your Result</h2>
    <p class="form-intro">Enter your name and roll number to view your result.</p>

    <form id="searchForm">
      <label for="board">Board</label>
      <select id="board" name="board" required>
        <option value="" selected disabled>Select board</option>
        <option value="BSEB">BSEB</option>
        <option value="CBSE">CBSE</option>
      </select>

      <label for="studentClass">Class</label>
      <select id="studentClass" name="class" required>
        <option value="" selected disabled>Select class</option>
      </select>

      <label for="subject">Subject</label>
      <select id="subject" name="subject" required>
        <option value="" selected disabled>Select subject</option>
        <option value="Biology">Biology</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Physics">Physics</option>
      </select>

      <label for="chapter">Chapter name</label>
      <select id="chapter" name="chapter" required>
        <option value="" selected disabled>Select chapter</option>
        <option value="CROP PRODUCTION AND MANAGEMENT">CROP PRODUCTION AND MANAGEMENT</option>
        <option value="THE FUNDAMENTAL UNIT OF LIFE">THE FUNDAMENTAL UNIT OF LIFE</option>
        <option value="LIFE PROCESSES">LIFE PROCESSES</option>
        <option value="THE UNIT OF LIFE">THE UNIT OF LIFE</option>
        <option value="REPRODUCTION IN ORGANISMS">REPRODUCTION IN ORGANISMS</option>
        <option value="CHEMICAL REACTIONS AND EQUATIONS">CHEMICAL REACTIONS AND EQUATIONS</option>
      </select>

      <label for="name">Student name</label>
      <input type="text" id="name" name="name" placeholder="Student name" required />

      <label for="roll">Roll number</label>
      <input type="text" id="roll" name="roll" placeholder="Roll number" required />

      <button id="searchBtn" type="submit">View result</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <a class="teacher-link" href="/teacher">Teacher Login</a>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
